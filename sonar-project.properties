sonar.projectKey=helm-python-ai
sonar.projectName=helm-python-ai
sonar.projectVersion=0.1.0

sonar.sources=src,scripts
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
# The agent's CLI entry point and the MCP wiring are exercised end-to-end
# by the in-process client checks, not the unit suite.
sonar.coverage.exclusions=tests/**,scripts/**
